# The runner (ADR-0014). There is no always-on box: this workflow *is* the worker.
#
# Two triggers, because there are two kinds of work:
#
#   schedule          — background drains. Five minutes is GitHub's floor, and it
#                       is a floor rather than a guarantee: a scheduled run may be
#                       delayed under load and is dropped entirely on a repository
#                       with no recent activity. Everything here assumes that.
#
#                       **Green from 2026-09-16, in the commit that set the secret.**
#                       Worth recording what was true before that, because the docs
#                       had it wrong for a day and the way they were wrong is the
#                       point. `4e95b89` commented this schedule out on 2026-09-16 —
#                       and was never pushed. Actions reads the workflow from the
#                       default branch on the remote, so stopping the cron in a local
#                       commit stopped nothing: the remote kept the `*/5` from
#                       `3ee2a66` (2026-09-12) and every tick failed on the runner's
#                       refusal to start without `DATABASE_URL`. **22 scheduled runs,
#                       22 failures, 2026-09-13 09:43 through 2026-09-16 16:59** —
#                       not thousands, because GitHub drops scheduled runs on a
#                       repository with no recent activity, which is the quiet part:
#                       a broken cron on an idle repo neither works nor announces
#                       itself. The fix and the un-fix shipped together in `e4c34a0`.
#                       Supabase (ap-southeast-1) and both secrets exist now, and a
#                       `workflow_dispatch` drained clean (`claimed: 0`, nothing yet
#                       due) before day 1 came due.
#
#                       **Fifteen minutes, not five.** The floor is for foreground
#                       work, and foreground work does not come through here: a
#                       human pressing a button gets `workflow_dispatch` (ADR-0016).
#                       What the schedule carries is the drift experiment, whose
#                       jobs come due once a day. At five minutes a seven-day
#                       experiment costs about two thousand runs to drain fourteen
#                       jobs; at fifteen it costs under seven hundred, and the
#                       worst case is that a day starts fourteen minutes late on a
#                       plot whose x-axis is the time the run actually happened.
#                       Minutes are free on a public repository, but a queue that
#                       is polled three times as often is not three times more
#                       correct, and GitHub drops scheduled runs under load.
#
#                       **The drift experiment (P1.8) is what depends on this.** It
#                       queues a week of `harvest.run` jobs up front, each with a
#                       `run_after` a day apart, and nothing else drains them: with
#                       no schedule, the days come due and stay due, and the plot
#                       shows six `missing` points and no line — the honest
#                       rendering of a queue nobody is reading, not a bug in the
#                       chart.
#   workflow_dispatch — foreground work (ADR-0016). A human pressed a button and is
#                       watching a progress stream; waiting up to five minutes for
#                       the next tick would make the product look dead. Left on, and
#                       left failing loudly without the secret: somebody who presses
#                       the button is owed the reason, not a green tick.
#
# The `jobId` input is not used to select work. The runner claims from the queue
# with `FOR UPDATE SKIP LOCKED` and drains whatever it wins, which is what makes a
# cancelled run harmless. The input exists so a run can be correlated with the job
# that caused it in the Actions log — the dispatch API returns 204 and no run id,
# so this is the only thread between the two.
name: worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job that triggered this run (for correlation only; the runner drains the queue)"
        required: false
        type: string
      budgetMinutes:
        description: "How long to drain (1-45). Raise it to work through a queued batch in one run."
        required: false
        default: "4"
        type: string
      shards:
        description: "Parallel drains in this run (1-6). Each claims its own rows; use it for a queued batch of slow jobs."
        required: false
        default: "1"
        type: string

# One runner at a time. A double-click that slipped past the API's idempotency
# check still cannot spend two runners, and two concurrent drains would only
# contend for the same rows anyway. `cancel-in-progress: false` because the
# in-flight run is doing real work with real browser minutes attached to it.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A matrix cannot be sized by an input directly, so this turns `shards` into the
  # list the drain job fans out over. The cron has no inputs and gets one shard.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        run: |
          n="$SHARDS"
          case "$n" in ''|*[!0-9]*) n=1 ;; esac
          [ "$n" -lt 1 ] && n=1
          [ "$n" -gt 6 ] && n=6
          list=1; i=2
          while [ "$i" -le "$n" ]; do list="$list,$i"; i=$((i + 1)); done
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"
        env:
          SHARDS: ${{ inputs.shards || '1' }}

  # The concurrency group above is per workflow run, so shards run side by side
  # inside one run while a second run still waits. `FOR UPDATE SKIP LOCKED` hands
  # each shard different rows. A shard is sequential, and an extraction is about
  # six minutes of model calls, so a hundred queued extractions are ten hours on
  # one shard and under two on six.
  drain:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Hard stop. The drain's own budget (WORKER_BUDGET_MS) is four minutes on the
    # cron, at most 45 on a dispatch, so it finishes on its own before this; the
    # timeout is the backstop for a handler that hangs on something that never
    # settles. Minutes spent here are free on a public repository, but a hung run
    # holds the concurrency group.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Drain the queue
        run: |
          m="$WORKER_BUDGET_MINUTES"
          case "$m" in ''|*[!0-9]*) m=4 ;; esac
          [ "$m" -lt 1 ] && m=1
          [ "$m" -gt 45 ] && m=45
          export WORKER_BUDGET_MS=$((m * 60000))
          pnpm --filter @dt/worker start
        env:
          # Direct to Postgres, not through Hyperdrive: Hyperdrive is a Workers
          # binding, and its 100,000-queries-a-day account ceiling is spent by the
          # API's streams. The runner has no reason to compete for it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: the Jev page judge on price probes. Unset, probes use the regex only.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # The route the 18 September bake-off chose (STATUS, P2.1; `.env.example`).
          # Defaulted here because an unset model makes every `refine.extract` fail,
          # and a repository variable of the same name overrides it.
          LLM_MODEL_EXTRACT: ${{ vars.LLM_MODEL_EXTRACT || 'deepseek/deepseek-v4-flash' }}
          # Ceilings are read from the environment but *defaulted in code*
          # (`loadCeilings`). A missing secret cannot raise a budget.
          BUDGET_SOLARI_MINUTES: ${{ vars.BUDGET_SOLARI_MINUTES }}
          BUDGET_LLM_INPUT_TOKENS: ${{ vars.BUDGET_LLM_INPUT_TOKENS }}
          BUDGET_LLM_OUTPUT_TOKENS: ${{ vars.BUDGET_LLM_OUTPUT_TOKENS }}
          BUDGET_GEOCODE_CALLS: ${{ vars.BUDGET_GEOCODE_CALLS }}
          BUDGET_SOLARI_MINUTES_TOTAL: ${{ vars.BUDGET_SOLARI_MINUTES_TOTAL }}
          # Finish inside the grace period GitHub gives a cancelled run, with room
          # to close browser sessions and hand the claims back.
          # A dispatch may ask for longer (`budgetMinutes`); the cron has no inputs
          # and gets four. Clamped in the step below, not trusted as typed.
          WORKER_BUDGET_MINUTES: ${{ inputs.budgetMinutes || '4' }}
          # Longer than the slowest handler that does not heartbeat. An extraction
          # runs about six minutes; on a five-minute lease another shard would
          # reclaim it mid-call and pay for the same batch twice.
          WORKER_LEASE_MS: "900000"
          # Logged for correlation only. The runner does not read it.
          WORKER_TRIGGER_JOB_ID: ${{ inputs.jobId }}
